services:
  - type: web
    name: ai-email-forensics
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DEBUG_MODE
        value: false
      - key: GMAIL_CREDENTIALS_JSON
        sync: false  # Set manually in Render dashboard
      - key: GMAIL_REFRESH_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: SAFE_BROWSING_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: MONAD_RPC_URL
        value: https://rpc.testnet.monad.xyz
      - key: MONAD_CHAIN_ID
        value: 10143
      - key: MONAD_EXPLORER_URL
        value: https://testnet.monadscan.com
      - key: MONAD_CONTRACT_ADDRESS
        value: 0xa898e4C6FF1060cA00B4747B1d7343c86C724C2a
      - key: MONAD_ADMIN_ADDRESS
        value: 0xa898e4C6FF1060cA00B4747B1d7343c86C724C2a
      - key: MONAD_PRIVATE_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
